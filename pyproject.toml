[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a1-trading-bot"
version = "0.1.0"
description = "Paper-first Alpaca swing-trading bot with a local dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.42,<1",
  "apscheduler>=3.11,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".deps", ".venv", ".pip-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

